project:
  type: book
  output-dir: _site
  # Plotly injects its own MathJax 2 next to every figure, which races Quarto's
  # MathJax 4 and can leave all math unrendered; see the script's docstring.
  post-render: ../scripts/strip_plotly_mathjax.py

book:
  title: "optimization-lab"
  subtitle: "Applied mathematical optimization, from first principles"
  description: >-
    How optimization algorithms work and why: the geometry of an objective, gradient and
    curvature methods, linear programs, least squares, constraints and duality,
    derivative-free search, estimation, and high-dimensional non-convex landscapes, with
    every figure computed from a from-scratch implementation.
  site-url: "https://ioannisantoniadis.github.io/optimization-lab/"
  repo-url: "https://github.com/ioannisantoniadis/optimization-lab"
  repo-actions: [edit, issue]
  image: images/social-preview.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  page-footer:
    left: >-
      Source on [GitHub](https://github.com/ioannisantoniadis/optimization-lab).
    right: "Rendered with [Quarto](https://quarto.org)."
  chapters:
    - index.qmd
    - chapters/00-map.qmd
    - part: "I. Foundations"
      chapters:
        - chapters/01-the-geometry-of-an-objective.qmd
        - chapters/02-gradient-methods.qmd
    - part: "II. Convex workhorses"
      chapters:
        - chapters/03-linear-programming.qmd
        - chapters/04-least-squares-and-regularization.qmd
        - chapters/05-constraints-and-duality.qmd
    - part: "III. Beyond convex and smooth"
      chapters:
        - chapters/06-derivative-free-and-global-search.qmd
        - chapters/07-estimation-as-optimization.qmd
        - chapters/08-high-dimensional-landscapes.qmd
    - part: "IV. Applications"
      chapters:
        - chapters/09-applications.qmd
  appendices:
    - appendix-choosing-an-algorithm.qmd
    - appendix-notation.qmd
    - appendix-the-code.qmd
    - appendix-further-reading.qmd
  navbar:
    background: light
  page-navigation: true

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    number-sections: true
    number-depth: 2
    code-fold: true
    code-summary: "Show the code"
    code-tools: true
    fig-align: center
    smooth-scroll: true
    grid:
      sidebar-width: 260px
      body-width: 850px
      margin-width: 250px
    link-external-newwindow: true

execute:
  freeze: auto
  cache: false
  warning: false

jupyter: optimlab

bibliography: references.bib
