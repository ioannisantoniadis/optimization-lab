name: Check frozen docs outputs

# docs/_quarto.yml uses `freeze: auto`, which re-executes a chapter only when its own
# .qmd changes. A change to src/optimlab/ can therefore leave the committed
# docs/_freeze/ outputs stale while every render still succeeds. This job re-executes
# every page from scratch and fails if any computed text (printed output, tables,
# inline numbers) differs from the committed freeze; see scripts/check_freeze.py.
#
# It runs on pull requests, so stale outputs are caught before merging, and on pushes
# to main as a backstop. There is no schedule: Python dependencies are pinned by
# uv.lock, so outputs cannot drift without a change to one of the paths below.

on:
  pull_request:
    paths:
      - "src/optimlab/**"
      - "docs/**"
      - "scripts/check_freeze.py"
      - "scripts/strip_plotly_mathjax.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/freeze-check.yml"
  push:
    branches: [main]
    paths:
      - "src/optimlab/**"
      - "docs/**"
      - "scripts/check_freeze.py"
      - "scripts/strip_plotly_mathjax.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/freeze-check.yml"
  workflow_dispatch:

jobs:
  fresh-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --extra viz --extra docs --extra backends

      - name: Register the project venv as a Jupyter kernel
        run: uv run python -m ipykernel install --user --name optimlab --display-name "optimlab (uv)"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render every chapter from scratch
        env:
          # Quarto's Jupyter driver must run in the project venv (it needs jupyter/nbformat).
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          cp -r docs/_freeze "$RUNNER_TEMP/committed_freeze"
          rm -rf docs/_freeze
          quarto render docs

      - name: Compare computed outputs with the committed freeze
        run: uv run python scripts/check_freeze.py "$RUNNER_TEMP/committed_freeze" docs/_freeze
