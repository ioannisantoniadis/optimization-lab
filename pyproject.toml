[project]
name = "optimization-lab"
version = "0.1.0"
description = "A living lab for applied mathematical optimization: from-scratch algorithms, real solver comparisons, cross-domain problems, and high-dimensional non-convex intuition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.20",
    "kaleido>=0.2.1",
    "marimo>=0.8",
]
backends = [
    "cvxpy>=1.5",
    "optuna>=3.6",
    "nevergrad>=1.0",
    "pymoo>=0.6",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# marimo generates a bare trailing expression / no-op `return` per cell by convention
# (the trailing expression is that cell's displayed output) — not a code smell here.
"notebooks/marimo/*.py" = ["B018", "PLR1711"]

[tool.pytest.ini_options]
testpaths = ["tests"]
